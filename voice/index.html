<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>อัดเสียงพากย์ · วาดแล้วสู้</title>
<link href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;font-family:'Bai Jamjuree',sans-serif;background:#0d0f16;color:#eef;padding:16px;max-width:760px;margin:auto}
h1{font-size:26px;margin:4px 0}p.s{color:#9aa3b8;margin:0 0 14px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}input,select{background:#161a26;color:#eef;border:1px solid #2b3145;border-radius:8px;padding:9px;font:inherit;flex:1;min-width:140px}
.ev{background:#141824;border:1px solid #232a3d;border-radius:12px;padding:12px;margin:10px 0}
.ev h3{margin:0 0 2px;font-size:17px}.ev small{color:#8a93a8}
.ln{display:flex;gap:6px;align-items:center;margin-top:8px;flex-wrap:wrap}.ln input{min-width:180px}
button{font:inherit;border:0;border-radius:8px;padding:9px 13px;cursor:pointer;background:#2b3145;color:#fff}
button.r{background:#e5484d}button.r.on{background:#ff9f1a;animation:p 1s infinite}button.g{background:#2fa36b}button.b{background:#3d6bff}
@keyframes p{50%{opacity:.6}}.ok{color:#5be08f;font-size:13px}.tip{background:#1b2133;border-radius:10px;padding:10px 12px;color:#b9c2d8;font-size:14px;line-height:1.6}
#msg{margin-top:10px;color:#ffcc66}
</style></head><body>
<h1>อัดเสียงพากย์ตัวละคร</h1>
<p class="s">อัดเสียงตัวเองตามเหตุการณ์ในเกม แล้วกดดาวน์โหลดแพ็ก เอาไปวางในโฟลเดอร์ VoicePacks ของเกม</p>
<div class="row"><input id="pn" placeholder="ชื่อแพ็ก เช่น เสียงพี่เพลิง"><input id="au" placeholder="ชื่อคนพากย์"></div>
<div class="row"><select id="hero"></select></div>
<div class="tip">กดปุ่มแดงค้างไว้ไม่ต้อง: กดครั้งเดียวเริ่มอัด กดอีกครั้งหยุด · แต่ละประโยคไม่เกิน 12 วินาที · ช่องข้อความคือซับไตเติ้ลที่จะขึ้นในเกม (เว้นว่างได้) · ไม่ต้องอัดครบทุกช่อง</div>
<div id="list"></div>
<div class="row"><button class="g" id="dl">ดาวน์โหลดแพ็กเสียง (.zip)</button></div>
<div id="msg"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
const HEROES={"":"ใช้ได้ทุกตัว",blaze:"เพลิงกาฬ",tide:"ธาราเงียบ",granite:"ภูผา",gale:"วายุพเนจร",volt:"อัสนี",nox:"เงาราตรี",titan:"ไททันเหล็ก",ink:"หมึกน้อย"};
const EV=[["select","ตอนถูกเลือก","ไฟของข้าไม่เคยดับ!"],["fightstart","เริ่มสู้","มาเลย!"],["attack","ตอนตี (นานๆ ที)","ฮ่า!"],["skill","ใช้สกิล","รับไปซะ!"],
["ultimate","ท่าไม้ตาย (R)","จงมอดไหม้!"],["hurt","โดนตี","อึก!"],["lowhp","เลือดใกล้หมด","ยัง...ไม่จบ!"],["dash","หลบ","เร็วกว่านี้อีก!"],
["kill","ล้มศัตรู","ตัวต่อไป!"],["bossappear","บอสโผล่","ตัวใหญ่ก็ไม่กลัว!"],["win","ชนะ","ชัยชนะเป็นของข้า!"],["lose","แพ้","ครั้งหน้า...ไม่แพ้แน่"],["rareaura","ได้ออร่าหายาก","พลังนี้มัน...!"]];
const hs=document.getElementById('hero');Object.entries(HEROES).forEach(([k,v])=>hs.add(new Option(v,k)));
const rec={};let cur=null;
const list=document.getElementById('list');
EV.forEach(([k,t,ex])=>{rec[k]=[];const d=document.createElement('div');d.className='ev';
d.innerHTML=`<h3>${t}</h3><small>ตัวอย่าง: “${ex}”</small><div class="lines"></div><div class="ln"><button data-add>+ เพิ่มประโยค</button></div>`;
list.appendChild(d);const L=d.querySelector('.lines');
const add=()=>{const i=rec[k].length;rec[k].push({wav:null,text:''});const r=document.createElement('div');r.className='ln';
r.innerHTML=`<button class="r">● อัด</button><button class="b" disabled>▶</button><input placeholder="ซับไตเติ้ล"><span class="ok"></span>`;
const [br,bp]=r.querySelectorAll('button'),inp=r.querySelector('input'),ok=r.querySelector('.ok');
inp.oninput=()=>rec[k][i].text=inp.value;
br.onclick=async()=>{if(cur&&cur.btn!==br)return;if(!cur){try{cur=await start();cur.btn=br;br.classList.add('on');br.textContent='■ หยุด';cur.t=setTimeout(()=>br.click(),12000);}catch(e){msg('เปิดไมค์ไม่ได้: อนุญาตไมโครโฟนในเบราว์เซอร์ก่อน');}}
else{clearTimeout(cur.t);const w=await stop(cur);cur=null;br.classList.remove('on');br.textContent='● อัดใหม่';rec[k][i].wav=w.blob;ok.textContent=w.sec.toFixed(1)+' วิ ✓';bp.disabled=false;}};
bp.onclick=()=>{const b=rec[k][i].wav;if(b)new Audio(URL.createObjectURL(b)).play();};
L.appendChild(r);};
d.querySelector('[data-add]').onclick=add;add();});
async function start(){const s=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});
const ac=new AudioContext();const src=ac.createMediaStreamSource(s);const pr=ac.createScriptProcessor(4096,1,1);const buf=[];
pr.onaudioprocess=e=>buf.push(new Float32Array(e.inputBuffer.getChannelData(0)));src.connect(pr);pr.connect(ac.destination);return{s,ac,pr,buf};}
async function stop(c){c.pr.disconnect();c.s.getTracks().forEach(t=>t.stop());const rate=c.ac.sampleRate;await c.ac.close();
let n=c.buf.reduce((a,b)=>a+b.length,0);const all=new Float32Array(n);let o=0;c.buf.forEach(b=>{all.set(b,o);o+=b.length;});
let a=0,z=n;const th=.02;while(a<n&&Math.abs(all[a])<th)a++;while(z>a&&Math.abs(all[z-1])<th)z--;a=Math.max(0,a-rate*.05|0);z=Math.min(n,z+rate*.15|0);
let pk=0;for(let i=a;i<z;i++)pk=Math.max(pk,Math.abs(all[i]));const g=pk>0?Math.min(4,.9/pk):1;
const cut=all.subarray(a,z),dv=new DataView(new ArrayBuffer(44+cut.length*2));const W=(p,s)=>[...s].forEach((ch,i)=>dv.setUint8(p+i,ch.charCodeAt(0)));
W(0,'RIFF');dv.setUint32(4,36+cut.length*2,true);W(8,'WAVE');W(12,'fmt ');dv.setUint32(16,16,true);dv.setUint16(20,1,true);dv.setUint16(22,1,true);
dv.setUint32(24,rate,true);dv.setUint32(28,rate*2,true);dv.setUint16(32,2,true);dv.setUint16(34,16,true);W(36,'data');dv.setUint32(40,cut.length*2,true);
for(let i=0;i<cut.length;i++)dv.setInt16(44+i*2,Math.max(-1,Math.min(1,cut[i]*g))*32767,true);
return{blob:new Blob([dv],{type:'audio/wav'}),sec:cut.length/rate};}
function msg(t){document.getElementById('msg').textContent=t;}
document.getElementById('dl').onclick=async()=>{const z=new JSZip(),name=(document.getElementById('pn').value||'MyVoice').trim();
const folder=name.replace(/[\\/:*?"<>|]/g,'_');const f=z.folder(folder);const lines={};let c=0;
for(const [k] of EV){const arr=[];rec[k].forEach((r,i)=>{if(!r.wav)return;const fn=`${k}_${i+1}.wav`;f.file(fn,r.wav);arr.push({file:fn,text:r.text});c++;});if(arr.length)lines[k]=arr;}
if(!c)return msg('ยังไม่ได้อัดเสียงเลยสักประโยค');
f.file('voice.json',JSON.stringify({format:'dfvoice',name,author:document.getElementById('au').value,character:hs.value,lines},null,1));
const blob=await z.generateAsync({type:'blob'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=folder+'.zip';a.click();
msg(`ได้ ${c} ประโยค · แตกไฟล์ zip แล้ววางโฟลเดอร์ "${folder}" ใน VoicePacks ของเกม (ในเกมกด "เปิดโฟลเดอร์เสียง")`);};
</script></body></html>
